name: Brand Openedx Deploy

on:
  push:
    branches:
      - prod
  
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Connect to EC2 and deploy brand-openedx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER_PROD }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          command_timeout: 180m0s
          script: |
            echo "Navigating to brand-openedx directory..."
            cd ~/lexconx/brand-openedx
            echo "Pulling latest changes from repository..."
            git pull
            echo "✅ Pulled latest changes"
            cd ..
            echo "Activating Python virtual environment..."
            source py-venv/bin/activate
            echo "🔨 Building MFE image..."
            tutor images build mfe
            echo "✅ MFE image built"
            echo "🔄 Rebooting MFE service..."
            tutor local reboot -d mfe
            echo "✅ MFE service rebooted"
            echo "🎉 Brand Openedx deployed successfully! ($(date))"